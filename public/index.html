<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Drop5</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
  <style>
    .cloudflare-shell{max-width:1100px;margin:8vh auto;padding:24px}.cf-heading{display:flex;justify-content:space-between;align-items:center;gap:16px}.cf-code{font:600 1.25rem monospace;cursor:pointer}.cf-upload{padding:48px 20px;text-align:center;border:2px dashed var(--text-secondary);border-radius:18px;cursor:pointer}.cf-upload.drag{border-color:#42a5f5;background:#42a5f51a}.cf-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:20px}.cf-file{padding:16px;border-radius:12px;background:var(--surface,#ffffff14);color:inherit;text-decoration:none;overflow-wrap:anywhere}.cf-file small{display:block;opacity:.7;margin-top:8px}.cf-status{min-height:1.5em;margin:12px 0}.cf-pending{display:none;padding:12px;background:#f0a50022;border-radius:10px}.cf-pending button{margin-left:8px}.cf-empty{opacity:.7;text-align:center;padding:24px}.cf-actions{display:flex;gap:8px;align-items:center}.cf-text{width:100%;min-height:100px;margin-top:12px}.cf-delete{margin-top:16px}
  </style>
</head>
<body>
  <main class="cloudflare-shell">
    <header class="cf-heading">
      <h1>Drop5</h1>
      <button class="cf-code" id="shareCode" type="button" data-i18n-title="copy_link"></button>
    </header>
    <section id="dropZone" class="cf-upload" tabindex="0" role="button"
      data-max-file-bytes="__MAX_FILE_SIZE__" data-i18n-aria-label="upload_text">
      <strong data-i18n="upload_text">Upload Files</strong><br>
      <small data-i18n="text_input">Enter text directly</small>
      <input id="fileInput" type="file" multiple hidden>
    </section>
    <textarea id="textInput" class="cf-text" data-i18n-placeholder="upload_hint" placeholder="Enter the content you want to send."></textarea>
    <div class="cf-actions">
      <button id="sendText" data-i18n="upload_text">Upload Files</button>
      <button id="deleteAll" class="cf-delete" data-i18n="delete_all_files">Delete all files</button>
    </div>
    <div id="status" class="cf-status" role="status"></div>
    <section id="pending" class="cf-pending"></section>
    <section id="files" class="cf-files"><p class="cf-empty" data-i18n="no_files_yet">No files yet</p></section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
